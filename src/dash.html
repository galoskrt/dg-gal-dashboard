<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>דיוק דיגיטלי · לידים</title>
<style>
/*FONT*/
:root{
  --bg:#f8f7fb; --card:#ffffff;
  --pink:#ff2d8e; --pinkS:#d81b73; --pinkT:#fff2f8; --pinkL:#ffe3ef;
  --orange:#ff7a1a; --orangeS:#c95c07; --orangeT:#fff6ee; --orangeL:#ffe7d2;
  --green:#34d399; --greenS:#0c8a5f; --greenT:#eefaf4; --greenL:#d6f2e6;
  --txt:#14121c; --mut:#4f4d5e; --mut2:#8b8899; --line:#ece9f2; --line2:#dfdbe9;
  --sh1:0 1px 2px rgba(20,18,28,.04), 0 4px 10px rgba(20,18,28,.045);
  --sh2:0 1px 2px rgba(20,18,28,.05), 0 8px 20px rgba(20,18,28,.055), 0 22px 44px rgba(20,18,28,.045);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font-family:'TelAviv','Segoe UI',Arial,Helvetica,sans-serif;font-size:14px;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font-family:inherit}
.hidden{display:none!important}

/* ── כניסה ─────────────────────────────────────────────── */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gbox{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line2);
  border-radius:24px 24px 24px 7px;padding:30px 24px;box-shadow:var(--sh2);text-align:center}
.gbox .brand{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--pink);margin:0 0 16px}
.gbox h1{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.gbox p{margin:0 0 20px;font-size:13.5px;color:var(--mut2);line-height:1.55}
.gbox input{width:100%;padding:13px 15px;border:1px solid var(--line2);border-radius:13px;
  font-size:16px;text-align:center;letter-spacing:.05em;background:#fff;color:var(--txt)}
.gbox input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pinkL)}
.gbox button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px 13px 13px 4px;
  background:var(--pink);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.gbox button:disabled{opacity:.55;cursor:default}
.gerr{margin-top:12px;font-size:13px;font-weight:700;color:var(--pinkS);min-height:18px}

/* ── מסגרת ─────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:20;background:rgba(248,247,251,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.htop{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.htop .b{font-size:12px;font-weight:800;letter-spacing:.09em;color:var(--pink);flex:1 1 auto}
.htop button{background:#fff;border:1px solid var(--line2);border-radius:10px;
  padding:7px 12px;font-size:12.5px;font-weight:800;color:var(--mut);cursor:pointer}
.stats{display:flex;gap:7px;overflow-x:auto;max-width:640px;margin:10px auto 0;
  padding-bottom:2px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stats span{flex:0 0 auto;background:#fff;border:1px solid var(--line2);border-radius:11px;
  padding:7px 11px;font-size:12px;color:var(--mut2);white-space:nowrap}
.stats b{color:var(--txt);font-size:14px;font-weight:800;margin-right:4px}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}

/* ── קבוצות וכרטיסים ───────────────────────────────────── */
.grp{margin-bottom:26px}
.ghead{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
.ghead h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.ghead .n{font-size:12.5px;font-weight:800;color:#fff;background:var(--mut2);
  border-radius:9px;padding:2px 9px}
.grp.now .ghead .n{background:var(--greenS)}
.grp.soon .ghead .n{background:var(--orange)}
.gnote{margin:0 0 12px;font-size:13px;color:var(--mut2);line-height:1.55}

.card{position:relative;background:var(--card);border:1px solid var(--line2);
  border-right:3px solid var(--mut2);border-radius:18px 18px 18px 5px;
  padding:15px 16px;margin-bottom:11px;box-shadow:var(--sh1);min-width:0}
.card.now{border-right-color:var(--greenS)}
.card.soon{border-right-color:var(--orange)}
.chead{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-width:0}
.cmain{flex:1 1 auto;min-width:0}
.cname{font-size:17px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.cbiz{display:block;font-size:12.5px;font-weight:700;color:var(--mut2);margin-top:2px;
  overflow-wrap:anywhere}
.cright{flex:0 0 auto;text-align:left}
.csum{font-size:17px;font-weight:800;white-space:nowrap;direction:ltr}
.cago{font-size:11.5px;color:var(--mut2);margin-top:3px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:8px;
  background:#f4f2f8;color:var(--mut);white-space:nowrap}
/* שיוך למודעה. גוון נפרד מהצ'יפים של האבחון, כדי שיהיה ברור שזה
   מאיפה הוא הגיע ולא מה הוא ענה. */
.chip.adchip{background:#efe9fb;color:#5b3fa8}
/* המודעה שהביאה אותו, עם הקריאייטיב עצמו. לראות את התמונה שהוא ראה
   שווה יותר מכל קוד מעקב, כי היא מזכירה מיד באיזה מסר הוא נגע. */
.adbox{display:flex;gap:11px;align-items:center;background:#faf9fd;
  border:1px solid var(--line);border-radius:13px;padding:9px;margin:0 0 14px}
.adthumb{width:56px;height:56px;object-fit:cover;border-radius:9px;display:block;
  border:1px solid var(--line2);background:#fff}
.adwho{min-width:0;display:flex;flex-direction:column;gap:1px}
.adwho b{font-size:13.5px;font-weight:800;color:var(--txt);overflow-wrap:anywhere}
.adwho span{font-size:11.5px;color:var(--mut2);overflow-wrap:anywhere}
.ph{margin:18px 0 8px;font-size:13px;font-weight:800;color:var(--txt)}
.tw{overflow-x:auto}
.adtab{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.adtab th,.adtab td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}
.adtab th{font-weight:800;color:var(--mut2);font-size:11.5px}
.adtab td:first-child{font-weight:800}
.adtab tbody tr:last-child td{border-bottom:0}
.adtab .pc{color:var(--mut2);font-weight:700}
.chip.aw-sees{background:var(--greenT);color:var(--greenS)}
.chip.aw-blind{background:var(--pinkT);color:var(--pinkS)}
.chip.aw-burned{background:var(--orangeT);color:var(--orangeS)}
.chip.tp-hot{background:var(--pinkT);color:var(--pinkS)}

.q{margin-top:12px;background:var(--orangeT);border:1px solid var(--orangeL);
  border-radius:13px;padding:11px 13px}
.q span{display:block;font-size:11px;font-weight:800;color:var(--orangeS);margin-bottom:4px}
.q p{margin:0;font-size:14px;line-height:1.55;overflow-wrap:anywhere}

.meet{margin-top:12px;background:var(--greenT);border:1px solid var(--greenL);
  border-radius:13px;padding:12px 14px}
.meet.off{background:#f4f2f8;border-color:var(--line2)}
.meet .mh{display:block;font-size:11px;font-weight:800;color:var(--greenS);margin-bottom:5px}
.meet.off .mh{color:var(--mut2)}
.meet .mw{margin:0;font-size:15px;font-weight:800;color:var(--txt);line-height:1.45}
.meet .mt{margin:3px 0 0;font-size:12.5px;color:var(--mut);line-height:1.45;overflow-wrap:anywhere}
.meet .btn{margin-top:10px}
.meet .btn.zoom{background:var(--greenS);border-color:var(--greenS);color:#fff}
.meet .btn.copy{margin-right:7px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;min-width:0}
.btn{display:inline-block;font-size:13.5px;font-weight:800;padding:9px 14px;border-radius:11px;
  text-decoration:none;border:1px solid var(--line2);background:#fff;color:var(--txt);
  cursor:pointer;white-space:nowrap}
.btn.call{background:var(--pink);border-color:var(--pink);color:#fff;direction:ltr;flex:1 1 auto;text-align:center}
.btn.wa{color:var(--greenS);border-color:var(--greenL)}
.btn.more{color:var(--mut)}
.row select{font-size:13px;font-weight:700;padding:9px 11px;border-radius:11px;
  border:1px solid var(--line2);background:#fff;color:var(--txt);max-width:160px}

.body{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);min-width:0}
.body h4{margin:0 0 8px;font-size:13.5px;font-weight:800}
.leaks{margin:0 0 18px;padding-right:18px}
.leaks li{margin-bottom:9px;font-size:13.5px;line-height:1.55}
.leaks b{display:block}
.leaks span{color:var(--mut)}
.ans{margin:0 0 18px;min-width:0}
.arow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:10px;
  align-items:baseline;padding:7px 0;border-bottom:1px solid #f4f2f8}
.aq{font-size:12.5px;color:var(--mut2);line-height:1.45;overflow-wrap:anywhere}
.aa{font-size:13px;font-weight:700;text-align:left;line-height:1.45;overflow-wrap:anywhere}
.note{display:block;font-size:12.5px;font-weight:800;color:var(--mut)}
.note textarea{display:block;width:100%;margin-top:6px;font-size:13.5px;font-weight:400;
  padding:9px 11px;border:1px solid var(--line2);border-radius:11px;resize:vertical}
.note textarea:focus{outline:none;border-color:var(--pink)}
.deal{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;
  font-weight:800;color:var(--mut)}
.deal input{width:120px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;
  font-size:13.5px;font-weight:700;direction:ltr;text-align:right}
.mail{display:flex;gap:8px;margin-top:12px}
.mail span{font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px}
.mail .ok{background:var(--greenT);color:var(--greenS)}
.mail .no{background:#f4f2f8;color:var(--mut2)}
.cr{max-width:640px;margin:0 auto 40px;padding:0 16px;text-align:center;font-size:11.5px;color:var(--mut2)}
.empty{font-size:14.5px;color:var(--mut2);text-align:center;padding:40px 0}

/* ── ביצועים ───────────────────────────────────────────── */
.ov{position:fixed;inset:0;z-index:40;background:rgba(20,18,28,.42);
  display:grid;place-items:end center;padding:0}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--bg);
  border-radius:22px 22px 0 0;padding:20px 16px 34px}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800}
.sheet .sub{margin:0 0 18px;font-size:13px;color:var(--mut2);line-height:1.55}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line2);border-radius:15px;padding:13px 14px}
.kpi .l{font-size:11.5px;color:var(--mut2);line-height:1.4}
.kpi .v{font-size:19px;font-weight:800;margin-top:4px;direction:ltr;text-align:right}
.kpi.warn{background:var(--orangeT);border-color:var(--orangeL)}
.kpi.warn .v{color:var(--orangeS)}
.nodata{background:#fff;border:1px dashed var(--line2);border-radius:15px;padding:16px;
  font-size:13.5px;color:var(--mut);line-height:1.6}
.fun{background:#fff;border:1px solid var(--line2);border-radius:15px;padding:6px 14px;margin-bottom:16px}
.fun .f{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px;
  border-bottom:1px solid #f4f2f8}
.fun .f:last-child{border-bottom:0}
.fun .f b{font-weight:800}
.sheet .close{width:100%;padding:14px;border:0;border-radius:13px;background:var(--txt);
  color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px}
.toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);z-index:60;
  background:var(--txt);color:#fff;font-size:13.5px;font-weight:700;padding:11px 18px;
  border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:420px){
  .kpis{grid-template-columns:1fr}
  .row .btn,.row select{flex:1 1 auto;text-align:center;max-width:none}
}

.eng{display:grid;gap:7px;margin:2px 0 14px}
.erow{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
.el{flex:0 0 76px;color:#8b8899;font-size:12.5px}
.ev{color:#14121c;line-height:1.5}
.unsub{margin:0 0 14px}
.unsub button{background:#fff;border:1px solid #dfdbe9;border-radius:11px;padding:9px 13px;
  font:inherit;font-size:13px;color:#8b8899;cursor:pointer}
.unsub button:hover{border-color:#ff2d8e;color:#ff2d8e}
.unsub.on{background:#fff5f9;border:1px solid #ffd0e4;border-radius:14px;padding:13px 14px;
  display:grid;gap:5px}
.unsub.on b{font-size:14px;color:#14121c}
.unsub.on span{font-size:12.5px;color:#4f4d5e;line-height:1.6}
.unsub.on button{justify-self:start;margin-top:4px}
.chip.unschip{background:#fff0f6;color:#c2185b;border-color:#ffd0e4}
.adtab .on{font-size:11.5px;color:#12a05e;font-weight:700}
.adtab .off{font-size:11.5px;color:#8b8899;font-weight:700}
.warn{margin-top:9px;font-size:12.5px;color:#a05a12;background:#fff8ec;
  border:1px solid #f3e2c4;border-radius:11px;padding:10px 12px;line-height:1.6}

.steptab td:nth-child(2){width:46%}
.bar{background:#f1eff6;border-radius:6px;height:10px;overflow:hidden}
.bar span{display:block;height:100%;background:#ff2d8e;border-radius:6px}
.chip.paidchip{background:#fff4ec;color:#a05a12;border-color:#f3e2c4}
.chip.demochip{background:#eef1f7;color:#5a6b8c;border-color:#d7deea}
.chip.nowachip{background:#fff0f0;color:#b3261e;border-color:#f5c6c2}
.chip.srcchip{background:#f4f2f8;color:#5a5470;border-color:#e4e0ee}
.chip.biopaidchip{background:#fff6ee;color:#c95c07;border-color:#ffe7d2}
.chip.manualchip{background:#eeeefb;color:#3b3b8f;border-color:#dcdcf5}
.setmeet{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.setmeet .mtinput{flex:1;min-width:160px;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #e4e0ee;border-radius:9px}
.setmeet .setmeetbtn{white-space:nowrap}
#addDlg{border:0;border-radius:16px;padding:20px;max-width:400px;width:92%;box-shadow:0 20px 60px rgba(20,18,28,.35)}
#addDlg::backdrop{background:rgba(20,18,28,.45)}
#addDlg h3{margin:0 0 12px;font-size:18px}
.addform input,.addform textarea{display:block;width:100%;margin:0 0 10px;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #e4e0ee;border-radius:10px;box-sizing:border-box}
.addform textarea{min-height:60px;resize:vertical}
.addbtns{display:flex;gap:10px;margin-top:6px}
.chip.segchip{background:#eef7f1;color:#0c8a5f;border-color:#cfeadd}
/* טבלת לידים */
.ltwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid #ece9f2;border-radius:14px}
table.ltable{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.ltable thead th{text-align:right;font-size:12px;font-weight:800;color:#8b8899;padding:11px 12px;border-bottom:1px solid #ece9f2;white-space:nowrap;position:sticky;top:0;background:#fff;z-index:1}
table.ltable td{padding:11px 12px;border-bottom:1px solid #f2f0f7;vertical-align:middle}
tr.lrow{cursor:pointer;transition:background .12s}
tr.lrow:hover{background:#faf9fd}
tr.lrow:last-child td{border-bottom:0}
.tdot{width:14px;padding-inline-end:0!important}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9a94a5}
.dot.now{background:#ff2d8e}.dot.soon{background:#ff7a1a}.dot.later{background:#9a94a5}
.tname{font-weight:800;color:#14121c;min-width:120px}
.tname .tbiz{display:block;font-weight:600;font-size:12px;color:#8b8899}
.tname .tflags{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
.tphone{direction:ltr;text-align:right;color:#4f4d5e;white-space:nowrap;font-variant-numeric:tabular-nums}
.tmeet{font-size:12.5px;color:#4f4d5e}.tmeet .pref{color:#c95c07;font-weight:700}
.mut{color:#c7c3d2}
.btn.wa.mini{padding:6px 10px;font-size:12.5px}
/* מודל כרטיס לקוח */
.overlay{position:fixed;inset:0;background:rgba(20,18,28,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:24px 12px;overflow-y:auto}
.overlay.open{display:flex}
.sheet{position:relative;background:#fff;border-radius:18px;max-width:560px;width:100%;padding:22px;box-shadow:0 24px 70px rgba(20,18,28,.4);margin:auto}
.sheetx{position:absolute;top:12px;left:12px;border:0;background:#f4f2f8;color:#5a5470;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;line-height:1}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:0 34px 10px 0}
.mhead .cname{font-size:20px;font-weight:800;color:#14121c}
.mhead .cbiz{display:block;font-size:13px;font-weight:600;color:#8b8899;margin-top:2px}
.mhead .cago{font-size:12px;color:#9a94a5;white-space:nowrap}
.danger{margin-top:18px;padding-top:14px;border-top:1px solid #f2eef4;text-align:center}
.btn.del{background:#fff;color:#c02626;border:1px solid #f0caca}
.btn.del:hover{background:#fdecec}
/* דסקטופ: רוחב מלא לטבלה ולסרגלים, במקום 640 שנועד למובייל */
@media(min-width:900px){
  main,.htop,.stats,.tabs,.cr{max-width:1400px}
  table.ltable{min-width:0}
}

/* ── לשוניות ───────────────────────────────────────────── */
.tabs{display:flex;gap:6px;max-width:640px;margin:10px auto 0}
.tabs button{flex:1 1 0;background:#fff;border:1px solid var(--line2);border-radius:11px;
  padding:9px 10px;font-size:13.5px;font-weight:800;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--txt);border-color:var(--txt);color:#fff}

/* ── קבוצות פייסבוק ────────────────────────────────────── */
.fbcat{margin-bottom:24px}
.fbcat>h2{margin:0 0 10px;font-size:17px;font-weight:800;display:flex;gap:9px;align-items:baseline}
.fbcat>h2 .n{font-size:12.5px;font-weight:800;color:#fff;background:var(--mut2);border-radius:9px;padding:2px 9px}
.fg{background:var(--card);border:1px solid var(--line2);border-right:3px solid var(--line2);
  border-radius:18px 18px 18px 5px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--sh1);min-width:0}
.fg.st-pending{border-right-color:var(--orange)}
.fg.st-live{border-right-color:var(--greenS)}
.fg.st-rejected{border-right-color:var(--pinkS)}
.fgh{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.fgn{flex:1 1 auto;min-width:0;font-size:15.5px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.fgs{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:8px;white-space:nowrap;
  background:#f4f2f8;color:var(--mut2)}
.fgs.st-pending{background:var(--orangeT);color:var(--orangeS)}
.fgs.st-live{background:var(--greenT);color:var(--greenS)}
.fgs.st-rejected{background:var(--pinkT);color:var(--pinkS)}
.fgm{margin-top:5px;font-size:12px;color:var(--mut2);display:flex;flex-wrap:wrap;gap:4px 10px}
.fgm b{color:var(--txt);font-weight:800}
.fgb{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
.fgb h4{margin:14px 0 8px;font-size:13px;font-weight:800}
.fgb h4:first-child{margin-top:0}
.vpick{display:flex;flex-wrap:wrap;gap:6px}
.vpick button{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:7px 11px;
  font-size:12.5px;font-weight:800;color:var(--mut);cursor:pointer}
.vpick button.on{background:var(--pink);border-color:var(--pink);color:#fff}

<body>

<script>
/* ============================================================
   דיוק דיגיטלי · דשבורד הלידים

   עמוד סטטי. אין כאן שרת שנרדם ואין קובץ נתונים שפורסם. הלידים מגיעים
   מהוורקר בלבד, מאחורי אימות, וכל מה שנשמר כאן הוא מפתח שנגזר במכשיר.

   האבטחה: הסיסמה נגזרת בדפדפן ב-PBKDF2, 600 אלף סבבים, מלח אקראי, והתוצאה
   היא המפתח שהוורקר מכיר. בקוד המקור של הדף אין שום סוד, ולכן קריאה שלו
   לא נותנת כלום. זה תיקון לפער שנשאר פתוח בדשבורד של תום, שם הטוקן עצמו
   יושב בתוך עמוד ציבורי.
   ============================================================ */

var WORKER = 'https://dg-gal-funnel.tom-harush.workers.dev';
var SALT_HEX = '/*SALT*/';
var ITER = 600000;
var KEY = null;      /* המפתח הגזור, חי רק בזיכרון ובלשונית הזו */
var PWORKER = 'https://project.dg-gal.online';
var PSALT_HEX = '/*PSALT*/';   /* מלח נפרד; מוזרק בבנייה, אינו סוד */
var PKEY = null;     /* טוקן אדמין לוורקר הפרויקטים, נגזר מאותה סיסמה במלח הזה */
var PROJECTS = [];
var LEADS = [];
var OPEN = {};

/* הסטטוסים של גל, בסדר שהוא נתן. הסדר הזה הוא מסע הליד. */
var STATUS = {
  new:'מילא שאלון אבחון',
  no1:'לא ענה 1', no2:'לא ענה 2', no3:'לא ענה 3',
  answered:'התקשרתי וענה',
  meeting_set:'קבע פגישת ניתוח',
  meeting_noshow:'לא הגיע או ביטל',
  meeting_attended:'הגיע לפגישה',
  proposal:'קיבל הצעת מחיר',
  meeting_won:'נסגרה עסקה',
  cold_fu:'פולואפ קר', hot_fu:'פולואפ חם',
  /* מספר שגוי, מתחרה סקרן או מילוי בטעות. בלי זה הם נספרים במכנה
     של כל מדד עלות ומייקרים אותו על הנייר. */
  irrelevant:'לא רלוונטי'
};
var BANDS = ['now','soon','later'];
var BAND_LABEL = { now:'תרים טלפון עכשיו', soon:'שווה מעקב היום', later:'עוד לא בשל' };
var BAND_NOTE = {
  now:'מבינים שיש בעיה, והדליפה גדולה מספיק כדי להצדיק שיחה.',
  soon:'יש כאן משהו אמיתי, אבל לא בוער. מעקב ולא חיוג מיידי.',
  later:'עוד לא רואים את הבעיה, או שהמספר קטן מכדי להצדיק את הזמן.'
};
var AWARE = { blind:'לא רואה את המספרים', sees:'רואה ומחפש פתרון', burned:'כבר ניסה ונכווה' };
var TEMP = { hot:'חם', warm:'פושר', cold:'קר' };
var SRC = { paid:'פרסום ממומן', mix:'ממומן ואורגני', ref:'פה לאוזן', org:'אורגני' };

/* שיוך למודעה, בשמות ולא בקודים.

   הכתובת שהמודעה שולחת נושאת שלושה תגים: utm_campaign, utm_content
   ו-utm_term. הם נכונים למערכת ולא לעין, ולכן הם מתורגמים כאן לשמות
   שאפשר לקרוא בלי לפענח כלום.

   ★ המפתחות חייבים להישאר זהים למה שיושב בקישור של המודעה במטא.
   שינוי באחד מהם בלי שינוי כאן, והליד יגיע בלי שיוך. */
var ADIMG = 'https://map.dg-gal.online/ads/';

var CAMPS = {
  'leakmap-sep26':     'קמפיין האבחון',
  'leakmap-rmk-sep26': 'רימרקטינג'
};
/* קבוצת מודעות אחת בכל קמפיין. המפתחות הישנים נשארים ממופים כי
   מודעות קיימות עדיין נושאות אותם בכתובת, ואסור שליד יגיע בלי שם. */
var SETS = {
  'broad-feed':           'קהל רחב · ישראל 28 עד 55',
  'broad-il-2855':        'קהל רחב · ישראל 28 עד 55',
  'started-not-finished': 'התחילו ולא סיימו · 30 יום',
  'rmk-story':            'התחילו ולא סיימו · 30 יום'
};
var ADS = {
  /* מסע 2026-09, המסרים החדשים. */
  'a1-bank':       { name: 'א · הבנק',              img: 'a1-bank' },
  'b2-table':      { name: 'ב · השולחן',            img: 'b2-table' },
  'c3-deal':       { name: 'ג · עלות עסקה',         img: 'c3-deal' },
  'd4-agency':     { name: 'ד · אנטי-סוכנויות',     img: 'd4-agency' },
  /* מסע קודם, נשאר ממופה כי לידים היסטוריים עדיין נושאים את המפתחות. */
  'a1-guess':      { name: 'א · ניחוש',             img: 'a1' },
  'b2-expert':     { name: 'ב · מומחיות',           img: 'b2' },
  'c3-cost':       { name: 'ג · עלות עסקה',         img: 'c3' },
  'd4-control':    { name: 'ד · שליטה',             img: 'd4' },
  'e5-video':      { name: 'ה · וידאו',             img: 'e5' },
  'r1-unfinished': { name: 'ר1 · המשך האבחון',      img: 'r1-unfinished' },
  'r2-map':        { name: 'ר2 · המפה שמחכה',       img: 'r2-map' },
  'r3-notdone':    { name: 'ר3 · לא סיימת את המפה', img: 'r3-notdone' }
};

/* ליד בלי תיוג אינו שגיאה: הוא הגיע אורגנית, מהמלצה, או הוזן ידנית. */
var NO_AD = 'לא ממודעה';
function adKey(l){ return ((l.utm || {}).ad || '').trim(); }
function setKey(l){ return ((l.utm || {}).adset || '').trim(); }
function campKey(l){ return ((l.utm || {}).campaign || '').trim(); }
/* אם המפתח לא מוכר, מציגים משפט בעברית ולא את הקוד עצמו. גל לא
   אמור לראares utm בשום מצב. */
function adName(l){
  var k = adKey(l);
  if(!k) return NO_AD;
  return (ADS[k] || {}).name || 'מודעה שעוד לא נרשמה כאן';
}

/* הקריאייטיב עצמו. בסטורי מוצגת הגרסה האנכית, כי זו שהוא באמת ראה. */
function adImage(l){
  var e = ADS[adKey(l)];
  if(!e) return '';
  /* מודעה אחת מגישה את כל המיקומים דרך התאמת נכסים, ולכן מוצגת
     תמונת הפיד כמייצגת. */
  return ADIMG + e.img + '-feed.png';
}
function adBlock(l){
  if(!adKey(l)) return '';
  var img = adImage(l);
  return '<div class="adbox">'
    + (img ? '<a href="' + img + '" target="_blank" rel="noopener">'
             + '<img class="adthumb" src="' + img + '" alt="" loading="lazy"></a>' : '')
    + '<div class="adwho"><b>' + esc(adName(l)) + '</b>'
    + '<span>' + esc(SETS[setKey(l)] || 'קבוצת מודעות שעוד לא נרשמה כאן') + '</span>'
    + '<span>' + esc(CAMPS[campKey(l)] || 'קמפיין שעוד לא נרשם כאן') + '</span>'
    + '</div></div>';
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function money(n){ return (Number(n) || 0).toLocaleString('en-US') + ' ₪'; }
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._x); t._x = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}
/* שעון ישראל תמיד ומפורשות, ולא שעון המכשיר. אחרת אותה רשומה מציגה
   שעה אחרת כשפותחים את הדשבורד מחו"ל, ואי אפשר להצליב מול המייל. */
function ilTime(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit',
                                         timeZone:'Asia/Jerusalem' });
}
function ago(iso){
  if(!iso) return '';
  var m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(m < 1) return 'עכשיו';
  if(m < 60) return 'לפני ' + m + ' דקות';
  var h = Math.round(m / 60);
  if(h < 24) return 'לפני ' + h + (h === 1 ? ' שעה' : ' שעות');
  var d = Math.round(h / 24);
  if(d === 1) return 'אתמול';
  if(d < 30) return 'לפני ' + d + ' ימים';
  return new Date(iso).toLocaleDateString('he-IL');
}
function wa(p){
  var n = String(p || '').replace(/\D/g, '').replace(/^0/, '');
  return n ? 'https://wa.me/972' + n : '';
}

/* ── גזירת המפתח ─────────────────────────────────────────── */
function hex2buf(h){
  var a = new Uint8Array(h.length / 2);
  for(var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16);
  return a;
}
function buf2hex(b){
  return Array.prototype.map.call(new Uint8Array(b), function(x){
    return ('00' + x.toString(16)).slice(-2); }).join('');
}
async function derive(pw, saltHex){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
    'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt: hex2buf(saltHex || SALT_HEX), iterations: ITER, hash:'SHA-256' },
    base, 256);
  return buf2hex(bits);
}

/* ── קריאות לוורקר ───────────────────────────────────────── */
async function wk(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + KEY,
    'Content-Type': 'application/json' }, opts.headers || {});
  var r = await fetch(WORKER + path, opts);
  if(r.status === 401) throw new Error('unauthorized');
  if(!r.ok) throw new Error('שגיאה ' + r.status);
  return r.json();
}

/* ── קריאות לוורקר הפרויקטים (ניהול לקוחות) ─────────────── */
async function pwk(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + PKEY,
    'Content-Type': 'application/json' }, opts.headers || {});
  var r = await fetch(PWORKER + path, opts);
  if(r.status === 401) throw new Error('unauthorized');
  if(!r.ok) throw new Error('שגיאה ' + r.status);
  return r.json();
}

async function doLogin(e){
  e.preventDefault();
  var btn = document.getElementById('gbtn'), err = document.getElementById('gerr');
  var pw = document.getElementById('pw').value.trim();
  if(!pw) return false;
  btn.disabled = true; btn.textContent = 'בודק...'; err.textContent = '';
  try {
    KEY = await derive(pw, SALT_HEX);
    PKEY = await derive(pw, PSALT_HEX);        /* אותה סיסמה, מלח נפרד → טוקן נפרד */
    await wk('/leads');                       /* האימות היחיד הוא שהוורקר עונה */
    try { sessionStorage.setItem('dg_k', KEY); sessionStorage.setItem('dg_pk', PKEY); } catch(x){}
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    await refresh();
    restoreTab();
  } catch(x){
    KEY = null;
    err.textContent = x.message === 'unauthorized' ? 'סיסמה שגויה' : 'לא הצלחתי להתחבר. נסה שוב.';
  }
  btn.disabled = false; btn.textContent = 'כניסה';
  return false;
}
function logout(){
  KEY = null; PKEY = null;
  try { sessionStorage.removeItem('dg_k'); sessionStorage.removeItem('dg_pk'); } catch(x){}

}

var HELD = ['meeting_attended','meeting_won'];

function renderStats(){
  if(TAB === 'fb' || TAB === 'clients') return;   /* לכל לשונית שורת מספרים משלה */
  /* הצ'יפים העליונים סופרים לידים אמיתיים בלבד, בלי לידי בדיקה, כמו מסך הביצועים. */
  var rl = realLeads();
  var n = rl.length;
  var hot = rl.filter(function(l){ return (l.priority || {}).band === 'now'; }).length;
  var booked = rl.filter(function(l){ return reached(l, 'booked', BOOKED); }).length;
  var held = rl.filter(function(l){ return reached(l, 'held', HELD); }).length;
  var won = rl.filter(function(l){ return reached(l, 'won', ['meeting_won']); }).length;
  var rev = rl.reduce(function(s, l){ return s + (Number(l.deal_amount) || 0); }, 0);

        + '<span>לחיוג עכשיו <b>' + hot + '</b></span>'

        + '<span>התקיימו <b>' + held + '</b></span>'
        + '<span>נסגרו <b>' + won + '</b></span>';

   בלי לחפש: מתי, ואיפה לוחצים. */

  var hour = d.toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' });
  return day + ' בשעה ' + hour;
}

/* מאזין אחד לכל כפתורי ההעתקה, כך ששום קישור לא צריך לעבור דרך onclick */
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-copy]');
  if(!b) return;
  e.preventDefault();
  var url = b.getAttribute('data-copy'), label = b.textContent;
  var done = function(){ b.textContent = 'הועתק';
    setTimeout(function(){ b.textContent = label; }, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, function(){ toast('לא הצלחתי להעתיק'); });
  } else {
    var i = document.createElement('input'); i.value = url; document.body.appendChild(i);
    i.select(); try { document.execCommand('copy'); done(); } catch(x){ toast('לא הצלחתי להעתיק'); }
    document.body.removeChild(i);
  }
});

async function delLead(id){

  var nm = l ? (l.name || 'הליד') : 'הליד';
  if(!confirm('למחוק את "' + nm + '" לצמיתות? הוא יורד גם מהסטטיסטיקה, ואי אפשר לשחזר.')) return;
  try {
    await wk('/lead/' + id, { method:'DELETE' });
    closeLead();
    await load();
    toast('הליד נמחק');
  } catch(x){ toast('לא נמחק. ' + x.message); }
}

function render(){
  renderStats();
  var order = { now:0, soon:1, later:2 };
  var sorted = LEADS.slice().sort(function(a, b){
    var ba = order[(a.priority || {}).band]; if(ba == null) ba = 3;
    var bb = order[(b.priority || {}).band]; if(bb == null) bb = 3;
    if(ba !== bb) return ba - bb;
    return ((b.priority || {}).score || 0) - ((a.priority || {}).score || 0);
  });
  if(!sorted.length){
    document.getElementById('list').innerHTML = '<p class="empty">עוד לא נכנס אף אבחון.</p>';
  } else {
    document.getElementById('list').innerHTML =
      '<div class="ltwrap"><table class="ltable"><thead><tr>'
      + '<th></th><th>שם</th><th>טלפון</th><th>פלח</th><th>מקור</th><th>סטטוס</th><th>מועד</th><th>וואטסאפ</th>'
      + '</tr></thead><tbody>' + sorted.map(rowHtml).join('') + '</tbody></table></div>';
  }
  if(eid){ var l = LEADS.find(function(x){ return x.id === eid; }); if(l) document.getElementById('leadBody').innerHTML = leadDetailHtml(l); }
}

function toggle(id){ if(eid === id) closeLead(); else openLead(id); }

async function patch(id, body, msg){
  try {
    var r = await wk('/lead/' + id, { method:'PATCH', body: JSON.stringify(body) });
    var i = LEADS.findIndex(function(l){ return l.id === id; });
    if(i >= 0 && r.lead) LEADS[i] = r.lead;
    render();
    if(msg) toast(msg);
  } catch(x){ toast('לא נשמר. ' + x.message); }
}
function setStatus(id, v){ patch(id, { status:v }, 'הסטטוס עודכן'); }
function saveNote(id, v){ patch(id, { notes:v }, 'ההערה נשמרה'); }
function saveDeal(id, v){ patch(id, { deal_amount: Number(v) || 0 }, 'הסכום נשמר'); }

/* ── מה הליד עשה בדף ─────────────────────────────────────────
   pre הוא דף הנחיתה, engage הוא דף התוצאה. שני מספרים על הסרטון
   במכוון: אחוז הוא הנקודה הרחוקה שאליה הגיע, ושניות הן צפייה
   אמיתית. מי שגורר את הסרגל לסוף מקבל אחוז גבוה ושניות נמוכות. */
function mmss(s){
  s = Math.max(0, Math.round(Number(s) || 0));
  return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}
/* הסיווג זהה לזה שבמונה היומי, כדי ששני המקומות לא יגידו דברים שונים
   על אותו אדם. ההבחנה היא היחס בין זמן הצפייה למקום שאליו הגיע. */
function howWatched(e){
  var p = Number(e.video_pct) || 0, s = Number(e.video_secs) || 0,
      L = Number(e.video_len) || 0;
  if(p < 25) return 'רפרף';
  if(!L) return s >= 20 ? 'צפה ברצינות' : 'גרר את הסרגל';
  var exp = L * (p / 100);
  return (exp > 0 && s / exp >= 0.7) ? 'צפה ברצינות' : 'גרר את הסרגל';
}
function vidTxt(e){
  if(!e || !e.video) return 'לא הפעיל את הסרטון';
  var p = Number(e.video_pct) || 0, L = Number(e.video_len) || 0;
  return 'סרטון ' + p + '%' + (L ? ' מתוך ' + mmss(L) : '')
       + (e.video_done ? ', עד הסוף' : '')
       + (e.video_secs ? ' · ' + mmss(e.video_secs) + ' צפייה' : '')
       + ' · ' + howWatched(e);
}
function engLine(label, e){
  if(!e || (!e.seconds && !e.video && !e.scroll)) return '';
  var bits = [vidTxt(e)];
  if(e.seconds) bits.push(mmss(e.seconds) + ' בדף');
  if(e.scroll) bits.push('גלילה ' + e.scroll + '%');
  if(e.booking_click) bits.push('לחץ לתיאום');
  if(e.asked) bits.push('שלח שאלה');
  return '<div class="erow"><span class="el">' + label + '</span>'
    + '<span class="ev">' + esc(bits.join(' · ')) + '</span></div>';
}
function engBlock(l){
  var a = engLine('דף הנחיתה', l.pre);
  var b = engLine('דף התוצאה', l.engage);
  if(!a && !b){
    return '<h4>מה עשה בדף</h4><div class="nodata">עוד לא הגיע דיווח מהדף. '
      + 'לידים שנקלטו לפני 09/09/2026 לא ידווחו לעולם, כי הדיווח היה שבור.</div>';
  }
  return '<h4>מה עשה בדף</h4><div class="eng">' + a + b + '</div>';
}

/* ── פילוח מקור, נטישה לפי שלב, וצפייה ב-VSL ──────────────────────
   שלושת אלה עונים על שאלה אחת: איפה החיכוך הכי גבוה. בלי פילוח מקור
   האחוזים מערבבים תנועה ממומנת עם תנועה מהביו באינסטגרם, ובלי נטישה
   לפי שלב יודעים כמה נטשו ולא איפה.                                 */
var STEPNAME = ['מאיפה מגיעים הלקוחות'];
for(var _i=1;_i<=8;_i++) STEPNAME.push('שאלה ' + _i);
STEPNAME.push('מסך השארת הפרטים');

function sumRich(rich){
  var t = { view:{paid:0,org:0}, click:{paid:0,org:0}, start:{paid:0,org:0},
            steps:{}, contact:0,
            vsl:{played:0,p25:0,p50:0,p75:0,p95:0,serious:0,skim:0,dragged:0,secs:0,len:0,n:0} };
  (rich||[]).forEach(function(d){
    ['view','click','start'].forEach(function(k){
      t[k].paid += ((d[k]||{}).paid)||0; t[k].org += ((d[k]||{}).org)||0; });
    for(var s in (d.steps||{})) t.steps[s] = (t.steps[s]||0) + d.steps[s];
    t.contact += d.contact||0;
    for(var v in t.vsl) if(v!=='len') t.vsl[v] += ((d.vsl||{})[v])||0;
    if((d.vsl||{}).len) t.vsl.len = d.vsl.len;
  });
  return t;
}

function srcRow(label, o){
  var tot = o.paid + o.org;
  return '<tr><td>' + label + '</td><td>' + o.paid + '</td><td>' + o.org
    + '</td><td><b>' + tot + '</b></td></tr>';
}

function richPanel(rich, doneByDate){
  var t = sumRich(rich);
  var anySrc = t.view.paid + t.view.org;
  var out = '';

  if(anySrc){
    out += '<h4 class="ph">ממומן מול אורגני</h4>'
      + '<div class="tw"><table class="adtab"><thead><tr><th>שלב</th><th>ממומן</th>'
      + '<th>אורגני</th><th>סהכ</th></tr></thead><tbody>'
      + srcRow('כניסות לדף', t.view)
      + srcRow('עברו לשאלון', t.click)
      + srcRow('התחילו לענות', t.start)
      + '</tbody></table></div>'
      + '<p class="sub" style="margin-top:8px">ממומן נקבע לפי fbclid או utm שהגיעו בכתובת, '
      + 'ונשמר שלושים יום. כל השאר אורגני: ביו באינסטגרם, וואטסאפ, סטורי, או כניסה ישירה.</p>';
  }

  /* ── נטישה לפי שלב ── */
  var steps = t.steps, tot = 0;
  for(var k in steps) tot += steps[k];
  if(tot){
    var maxv = 0;
    for(var k2 in steps) if(steps[k2] > maxv) maxv = steps[k2];
    var rows = '';
    for(var i = 0; i <= 9; i++){
      var n = steps[String(i)] || 0;
      if(!n) continue;
      var w = maxv ? Math.round(n / maxv * 100) : 0;
      rows += '<tr><td>' + esc(STEPNAME[i] || ('שלב ' + i)) + '</td>'
        + '<td><div class="bar"><span style="width:' + w + '%"></span></div></td>'
        + '<td><b>' + n + '</b> <span class="pc">' + Math.round(n/tot*100) + '%</span></td></tr>';
    }
    out += '<h4 class="ph">איפה נוטשים את השאלון</h4>'
      + '<div class="tw"><table class="adtab steptab"><tbody>' + rows + '</tbody></table></div>'
      + '<p class="sub" style="margin-top:8px">כל נוטש נספר פעם אחת, בשלב הרחוק ביותר שאליו הגיע. '
      + 'השורה הגבוהה ביותר היא המקום שבו כדאי להוריד חיכוך.</p>';
  }

  /* ── הסרטון ── */
  var v = t.vsl;
  if(v.played){
    var q = function(a,b){ return b ? Math.round(a/b*100)+'%' : '·'; };
    out += '<h4 class="ph">הסרטון בדף הבית</h4>'
      + '<div class="fun" style="margin-bottom:10px">'
      +   f('הפעילו', v.played)
      +   f('עברו רבע', v.p25 + ' (' + q(v.p25,v.played) + ')')
      +   f('עברו חצי', v.p50 + ' (' + q(v.p50,v.played) + ')')
      +   f('עברו שלושה רבעים', v.p75 + ' (' + q(v.p75,v.played) + ')')
      +   f('ראו עד הסוף', v.p95 + ' (' + q(v.p95,v.played) + ')')
      +   f('אורך הסרטון', v.len ? Math.floor(v.len/60)+':'+('0'+Math.round(v.len%60)).slice(-2) : '·')
      + '</div>'
      + '<div class="tw"><table class="adtab"><thead><tr><th>איך צפו</th><th>כמה</th>'
      + '<th>מתוך המפעילים</th></tr></thead><tbody>'
      + '<tr><td>צפו ברצינות</td><td>' + v.serious + '</td><td>' + q(v.serious,v.played) + '</td></tr>'
      + '<tr><td>גררו את הסרגל</td><td>' + v.dragged + '</td><td>' + q(v.dragged,v.played) + '</td></tr>'
      + '<tr><td>רפרפו ועזבו</td><td>' + v.skim + '</td><td>' + q(v.skim,v.played) + '</td></tr>'
      + '</tbody></table></div>'
      + '<p class="sub" style="margin-top:8px">רצינות נמדדת ביחס בין זמן הצפייה שנצבר למקום שאליו '
      + 'הגיעו בסרגל. מי שגרר קדימה מגיע רחוק בלי לצפות, וזה נראה כאן בנפרד.</p>';
  } else {
    out += '<h4 class="ph">הסרטון בדף הבית</h4><div class="nodata">עוד לא נמדדה צפייה. '
      + 'המדידה נוספה ב-09/09/2026 ומתמלאת מהמבקר הבא, גם אם הוא לא השאיר פרטים.</div>';
  }
  return out;
}

/* ── פרסום ממומן ─────────────────────────────────────────────
   חוק ברזל: דשבורד של משפך ממומן מכיר את מזהי הקמפיינים שבנינו לו,
   ומודד אותם. הטוקן יושב בוורקר בלבד, כי הדף הזה סטטי וגלוי.
   שתי עלויות במכוון: מה שמטא סופרת, ומה שאנחנו קלטנו בפועל.
   ההפרש ביניהן הוא מידע, לא תקלה.                              */
function campLeads(){
  return realLeads().filter(function(l){ return ((l.utm || {}).campaign || '').trim(); }).length;
}
async function metaPanel(){
  var d = null;
  try { d = await wk('/meta?range=maximum'); } catch(x){
    return '<div class="nodata">לא הצלחתי למשוך נתונים ממטא. ' + esc(x.message) + '</div>';
  }
  if(d.error || !d.configured){
    return '<div class="nodata">מזהי הקמפיינים עוד לא הוגדרו למשפך הזה. '
      + 'בלעדיהם אין עלות לאבחון, וזו חצי תמונה.</div>';
  }
  var t = d.total, ours = campLeads();
  var cpl = ours ? (t.spend / ours) : 0;
  /* עלות לעסקה ו-ROAS, מיוחסים לקמפיין. אלה המדדים שמודדים כסף אמיתי,
     לא מילויים זולים. */
  var cWon = realLeads().filter(function(l){
    return ((l.utm || {}).campaign || '').trim() && reached(l, 'won', ['meeting_won']); }).length;
  var cRev = realLeads().reduce(function(s, l){
    return s + ((((l.utm || {}).campaign || '').trim() && reached(l, 'won', ['meeting_won']))
      ? (Number(l.deal_amount) || 0) : 0); }, 0);
  var cpd = cWon ? (t.spend / cWon) : 0;
  var roas = (t.spend && cRev) ? (cRev / t.spend) : 0;
  var rows = d.campaigns.map(function(c){
    var st = c.status === 'ACTIVE' ? '<span class="on">פעיל</span>'
           : '<span class="off">' + (c.status === 'PAUSED' ? 'מושהה' : esc(c.status || '·')) + '</span>';
    return '<tr><td>' + esc(c.name || c.id) + '<br>' + st + '</td>'
      + '<td>' + money(c.spend) + '</td><td>' + c.impressions.toLocaleString('en-US') + '</td>'
      + '<td>' + c.clicks + '</td><td>' + c.lpv + '</td></tr>';
  }).join('');
  return '<h4 class="ph">פרסום ממומן</h4>'
    + '<div class="fun" style="margin-bottom:12px">'
    +   f('הוצאה', money(t.spend))
    +   f('חשיפות', t.impressions.toLocaleString('en-US'))
    +   f('אנשים שנחשפו', t.reach.toLocaleString('en-US'))
    +   f('קליקים', t.clicks + ' (' + t.ctr + '%)')
    +   f('עלות לקליק', money(t.cpc))
    +   f('הגיעו לדף', t.lpv)
    +   f('אבחונים מהקמפיין', ours)
    +   f('עלות לאבחון', ours ? money(cpl) : 'עוד אין')
    +   f('עלות לעסקה', cWon ? money(cpd) : 'עוד אין')
    +   f('החזר על הפרסום', roas ? (roas.toFixed(2) + 'x') : 'עוד אין')
    + '</div>'
    + '<div class="tw"><table class="adtab"><thead><tr><th>קמפיין</th><th>הוצאה</th>'
      + '<th>חשיפות</th><th>קליקים</th><th>הגיעו לדף</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table></div>'
    + (t.clicks && t.lpv < t.clicks * 0.75
        ? '<p class="warn">' + (t.clicks - t.lpv) + ' מתוך ' + t.clicks + ' הקליקים '
          + 'לא נספרו ככניסה לדף. זה נורמלי בחלקו, אבל פער גדול מעיד על דף שנטען לאט '
          + 'או על נטישה לפני שהפיקסל הספיק לירות.</p>' : '')
    + (t.results !== ours
        ? '<p class="sub" style="margin-top:8px">מטא סופרת ' + t.results + ' המרות ואנחנו קלטנו '
          + ours + '. פער כזה נורמלי ביומיים הראשונים, כי הייחוס אצלה מתעדכן באיחור.</p>' : '');
}

/* ── ביצועים ─────────────────────────────────────────────
   מה שגל מחליט לפיו. עלות לפנייה איננה כאן במתכוון: היא המדד שגורם
   לאנשים לקנות תנועה זולה ולא לקוחות.                                */
/* אותה שיטה שהוורקר משתמש בה בדיוק, כדי שתאריך ליד וכניסה לדף
   יתאימו זה לזה גם כשהם נספרים בשני מקומות שונים. */
function ilDate(d){
  return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Jerusalem' }).format(d || new Date());
}
/* מילאו שאלון זה בדיוק ליד שנוצר, בלי צורך לספור אותו פעמיים בשרת.
   מקבצים לפי היום שלו כאן, כדי להשוות מול כניסות והתחלות מאותו יום. */
function completionsByDate(){
  var out = {};
  LEADS.forEach(function(l){
    var d = l.created_at ? ilDate(new Date(l.created_at)) : null;
    if(!d) return;
    out[d] = (out[d] || 0) + 1;
  });
  return out;
}
function pct(a, b){ return b ? Math.round(a / b * 100) + '%' : '·'; }

async function funnelPanel(){
  var stats = null;
  try { stats = await wk('/funnel-stats?days=14'); } catch(x){ return ''; }
  var rich = richPanel(stats && stats.rich);
  var days = (stats && stats.days) || [];
  var done = completionsByDate();
  var tv=0, tc=0, ts=0, td=0;
  var rows = days.map(function(r){
    var d = done[r.date] || 0;
    tv += r.view; tc += r.click; ts += r.start; td += d;
    return '<tr><td>' + r.date.slice(5) + '</td><td>' + r.view + '</td>'
      + '<td>' + r.click + ' <span class="pc">' + pct(r.click, r.view) + '</span></td>'
      + '<td>' + r.start + ' <span class="pc">' + pct(r.start, r.click) + '</span></td>'
      + '<td>' + d + ' <span class="pc">' + pct(d, r.start) + '</span></td></tr>';
  }).join('');
  var anyData = tv || tc || ts || td;
  return '<h4 class="ph">משפך הדף, 14 יום אחרונים</h4>'
    + (anyData
        ? '<div class="fun" style="margin-bottom:12px">'
          +   f('כניסות לדף', tv)
          +   f('עברו לשאלון', tc + ' (' + pct(tc, tv) + ')')
          +   f('התחילו לענות', ts + ' (' + pct(ts, tc) + ')')
          +   f('מילאו שאלון', td + ' (' + pct(td, ts) + ')')
          + '</div>'
          + '<div class="tw"><table class="adtab"><thead><tr><th>תאריך</th><th>כניסות</th>'
            + '<th>עברו לשאלון</th><th>התחילו</th><th>מילאו</th></tr></thead>'
            + '<tbody>' + rows + '</tbody></table></div>'
          + '<p class="sub" style="margin-top:8px">אם יש הרבה כניסות ומעט מעברים לשאלון, '
            + 'הבעיה כנראה בדף. אם יש הרבה שהתחילו ומעט שסיימו, הבעיה כנראה בשאלון עצמו.</p>'
        : '<div class="nodata">אין עדיין נתונים. הטבלה הזאת מתמלאת לבד מרגע שמישהו נכנס לדף.</div>') + rich;
}

/* לידי בדיקה נשארים ברשימה כדי שאפשר יהיה לראות אותם, אבל הם לא
   נספרים באף מדד. אחרת פגישה שנקבעה בבדיקה נראית כמו שיחה אמיתית. */
function realLeads(){ return LEADS.filter(function(l){ return !l.demo; }); }

async function openPerf(){
  var funnel = await funnelPanel();
  var n = realLeads().length;
  var booked = realLeads().filter(function(l){ return reached(l, 'booked', BOOKED); }).length;
  var held = realLeads().filter(function(l){ return reached(l, 'held', HELD); }).length;
  var noshow = realLeads().filter(function(l){ return reached(l, 'noshow', ['meeting_noshow']); }).length;
  var won = realLeads().filter(function(l){ return reached(l, 'won', ['meeting_won']); }).length;
  var rev = realLeads().reduce(function(s, l){ return s + (Number(l.deal_amount) || 0); }, 0);

  /* ── פילוח לפי מודעה ─────────────────────────────────────────
     המדד של מסמך 09 הוא עלות למפה שהושלמה, ולכן הספירה כאן היא לפי
     מודעה ולא לפי קמפיין. הטבלה נבנית מהמודעות שבאמת הגיעו לידים
     מהן, ולכן היא מתחילה ריקה ומתמלאת מעצמה ברגע שהקמפיין נדלק. */
  var byAd = {};
  realLeads().forEach(function(l){
    var k = adName(l);
    if(!byAd[k]) byAd[k] = { maps:0, booked:0, held:0, won:0, rev:0 };
    var r = byAd[k];
    r.maps++;
    if(reached(l, 'booked', BOOKED)) r.booked++;
    if(reached(l, 'held', HELD)) r.held++;
    if(reached(l, 'won', ['meeting_won'])) r.won++;
    r.rev += Number(l.deal_amount) || 0;
  });
  /* .name ולא האובייקט. byAd ממופתח בשם המודעה בעברית, וההשוואה מול
     האובייקט לעולם לא התאימה, ולכן כל ליד שהגיע ממודעה נשר מהטבלה
     ורק "לא ממודעה" שרד. נצפה בפועל: מור ואלי לא הופיעו כלל. */
  var order = Object.keys(ADS).map(function(k){ return ADS[k].name; }).concat([NO_AD]);
  /* מודעה שהביאה ליד אבל אינה במפה עדיין, כדי ששום ליד לא ייעלם. */
  Object.keys(byAd).forEach(function(k){ if(order.indexOf(k) < 0) order.push(k); });
  var rows = order.filter(function(k){ return byAd[k]; }).map(function(k){
    var r = byAd[k];
    return '<tr><td>' + esc(k) + '</td><td>' + r.maps + '</td><td>' + r.booked
      + '</td><td>' + r.held + '</td><td>' + r.won + '</td><td>'
      + (r.rev ? money(r.rev) : '·') + '</td></tr>';
  }).join('');

  var perAd = '<h4 class="ph">לפי מודעה</h4>'
    + (rows
        ? '<div class="tw"><table class="adtab"><thead><tr><th>מודעה</th><th>אבחונים</th>'
          + '<th>נקבעו</th><th>התקיימו</th><th>נסגרו</th><th>הכנסה</th></tr></thead>'
          + '<tbody>' + rows + '</tbody></table></div>'
        : '<div class="nodata">אין עדיין ליד שהגיע ממודעה. הטבלה הזאת תתמלא '
          + 'מעצמה ברגע שהקמפיין נדלק, שורה לכל מודעה.</div>');

  var meta = await metaPanel();

  var body =
    meta
    + funnel
    + perAd
    + '<div class="fun" style="margin-top:16px">'
    +   f('אבחונים שהושלמו', n)
    +   f('שיחות שנקבעו', booked)
    +   f('שיחות שהתקיימו', held)
    +   f('לא הגיעו', noshow)
    +   f('נסגרו', won)
    +   f('הכנסה', money(rev))
    + '</div>';

  var ov = document.createElement('div');
  ov.className = 'ov';
  ov.onclick = function(e){ if(e.target === ov) ov.remove(); };
  ov.innerHTML = '<div class="sheet"><h3>ביצועים</h3>'
    + '<p class="sub">אבני הדרך דביקות. ליד שהגיע לשיחה נשאר סופר גם אחרי שהסטטוס התקדם.</p>'
    + body + '<button class="close">סגור</button></div>';
  ov.querySelector('.close').onclick = function(){ ov.remove(); };
  document.body.appendChild(ov);
}
function f(label, v){
  return '<div class="f"><span>' + label + '</span><b>' + v + '</b></div>';
}

/* ============================================================
   קבוצות פייסבוק · ניהול הפרסום לקהילה

   מחליף את הדוקס הידני של גל: לכל קבוצה איזה נוסח נשלח, באיזה סטטוס,
   ומי הגיב "אשמח". הכל יושב בוורקר (/fb), ולכן הנייד והמחשב רואים את
   אותו מצב. כל הכפתורים עוברים דרך data-act ומאזין אחד, בלי כתובות
   בתוך onclick (מלכודת שכבר שברה את הדף פעם אחת).
   ============================================================ */
var TAB = 'leads';
var FB = null;
var FBOPEN = {}, FBPICK = {}, FBASK = {};
var CATS = [['realestate','מתווכי נדל"ן'], ['law','עורכי דין'],
  ['finance','יועצי משכנתאות ופיננסים'], ['investors','משקיעים ומלווי השקעות'], ['other','קבוצות נוספות']];
var PST = { pending:'ממתין לאישור', live:'באוויר', rejected:'נדחה או נמחק' };

function showTab(t){
  TAB = t;
  document.getElementById('tab-leads').classList.toggle('on', t === 'leads');
  document.getElementById('tab-fb').classList.toggle('on', t === 'fb');
  document.getElementById('tab-clients').classList.toggle('on', t === 'clients');
  document.getElementById('list').classList.toggle('hidden', t !== 'leads');
  document.getElementById('fb').classList.toggle('hidden', t !== 'fb');
  document.getElementById('clients').classList.toggle('hidden', t !== 'clients');
  document.getElementById('pbtn').classList.toggle('hidden', t !== 'leads');
  document.getElementById('addbtn').classList.toggle('hidden', t !== 'leads');
  try { sessionStorage.setItem('dg_tab', t); } catch(x){}
  if(t === 'fb'){ if(FB) fbRender(); fbLoad(false, !!FB); }
  else if(t === 'clients'){ if(PROJECTS.length) clientsRender(); clientsLoad(false, PROJECTS.length > 0); }
  else renderStats();
}
function restoreTab(){
  var t = null;
  try { t = sessionStorage.getItem('dg_tab'); } catch(x){}
  if(t === 'fb') showTab('fb');
  else if(t === 'clients') showTab('clients');
}
function refreshTab(){ return TAB === 'fb' ? fbLoad(true) : (TAB === 'clients' ? clientsLoad(true) : refresh()); }

async function fbLoad(withBtn, silent){
  var b = document.getElementById('rbtn');
  if(withBtn){ b.disabled = true; b.textContent = 'טוען...'; }
  try {
    var r = await wk('/fb');
    var changed = !FB || !r.state || r.state.updated_at !== FB.updated_at;
    FB = r.state;
    if(!silent || changed) fbRender();
  } catch(x){ if(!silent) toast(x.message); }
  if(withBtn){ b.disabled = false; b.textContent = 'רענון'; }
}
async function fbDo(op, msg){
  try {
    var r = await wk('/fb/op', { method:'POST', body: JSON.stringify(op) });
    FB = r.state; fbRender();
    if(msg) toast(msg);
  } catch(x){ toast('לא נשמר. ' + x.message); }
}

function fbPosts(gid){
  return FB.posts.filter(function(p){ return p.group === gid; })
    .sort(function(a, b){ return a.at < b.at ? 1 : -1; });
}
function fbVar(id){ return FB.variants.filter(function(v){ return v.id === id; })[0] || { id:id, title:'', text:'' }; }

/* ההצעה: נוסח שעוד לא נשלח לקבוצה הזו, ומתוכם זה שהכי פחות בשימוש
   היום ואז בכלל, כדי שאותו טקסט לא ירוץ בכמה קבוצות באותו יום. */
function fbSuggest(gid){
  var here = {}, today = {}, all = {}, day = ilDate();
  fbPosts(gid).forEach(function(p){ here[p.variant] = 1; });
  FB.posts.forEach(function(p){
    all[p.variant] = (all[p.variant] || 0) + 1;
    if(ilDate(new Date(p.at)) === day) today[p.variant] = (today[p.variant] || 0) + 1;
  });
  return FB.variants.map(function(v){ return v.id; }).sort(function(a, b){
    return ((here[a] || 0) - (here[b] || 0)) || ((today[a] || 0) - (today[b] || 0))
      || ((all[a] || 0) - (all[b] || 0)) || (a < b ? -1 : 1);
  })[0];
}

function fbCopy(text){
  var done = false;
  try {
    var t = document.createElement('textarea');
    t.value = text; t.setAttribute('readonly', '');
    t.style.position = 'fixed'; t.style.top = '-1000px'; t.style.opacity = '0';
    document.body.appendChild(t);
    t.focus(); t.select(); t.setSelectionRange(0, text.length);
    done = document.execCommand('copy');
    document.body.removeChild(t);
  } catch(x){}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){});
    done = true;
  }
  return done;
}

function fbStats(){
  var groups = FB.groups.length, posted = {}, n = { pending:0, live:0, rejected:0 };
  var cms = 0, sent = 0, joined = 0, today = 0, day = ilDate();
  FB.posts.forEach(function(p){
    posted[p.group] = 1;
    n[p.status] = (n[p.status] || 0) + 1;
    if(ilDate(new Date(p.at)) === day) today++;
    (p.commenters || []).forEach(function(c){ cms++; if(c.sent) sent++; if(c.joined) joined++; });
  });
  document.getElementById('stats').innerHTML =
      '<span>קבוצות שפורסמו <b>' + Object.keys(posted).length + '/' + groups + '</b></span>'
    + '<span>היום <b>' + today + '</b></span>'
    + '<span>ממתינים לאישור <b>' + n.pending + '</b></span>'
    + '<span>באוויר <b>' + n.live + '</b></span>'
    + '<span>הגיבו "אשמח" <b>' + cms + '</b></span>'
    + '<span>נשלח קישור <b>' + sent + '</b></span>'
    + '<span>הצטרפו <b>' + joined + '</b></span>';
}

function fbPostHtml(p){
  var v = fbVar(p.variant);
  var opts = Object.keys(PST).map(function(k){
    return '<option value="' + k + '"' + (p.status === k ? ' selected' : '') + '>' + PST[k] + '</option>'; }).join('');
  var cms = (p.commenters || []).map(function(c){
    return '<div class="cm"><span class="nm">' + esc(c.name || 'בלי שם') + '</span>'
      + '<button class="tg' + (c.sent ? ' on' : '') + '" data-act="c-sent" data-p="' + p.id + '" data-c="' + c.id + '">'
      + (c.sent ? 'נשלח קישור' : 'לשלוח קישור') + '</button>'
      + '<button class="tg' + (c.joined ? ' on' : '') + '" data-act="c-joined" data-p="' + p.id + '" data-c="' + c.id + '">'
      + (c.joined ? 'הצטרף' : 'הצטרף?') + '</button>'
      + '<button class="x" data-act="c-del" data-p="' + p.id + '" data-c="' + c.id + '" title="מחיקה">×</button></div>';
  }).join('');
  return '<div class="post">'
    + '<div class="ptop"><b>נוסח ' + esc(p.variant) + '</b><span>' + esc(v.title) + '</span>'
    +   '<span>' + esc(ago(p.at)) + '</span>'
    +   '<select data-act="p-status" data-p="' + p.id + '">' + opts + '</select>'
    +   '<button class="del" data-act="p-del" data-p="' + p.id + '">מחיקת הפרסום</button></div>'
    + '<div class="cms">' + cms + '</div>'
    + '<div class="cadd"><input placeholder="שם מי שהגיב אשמח" data-in="c-name" data-p="' + p.id + '">'
    +   '<button class="fbtn sm" data-act="c-add" data-p="' + p.id + '">הוספה</button></div>'
    + '</div>';
}

function fbGroupHtml(g){
  var ps = fbPosts(g.id), lp = ps[0], st = lp ? lp.status : 'none', open = !!FBOPEN[g.id];
  var cms = 0, joined = 0;
  ps.forEach(function(p){ (p.commenters || []).forEach(function(c){ cms++; if(c.joined) joined++; }); });
  var meta = lp
    ? '<b>נוסח ' + esc(lp.variant) + '</b><span>' + esc(ago(lp.at)) + '</span>'
      + (ps.length > 1 ? '<span>' + ps.length + ' פרסומים</span>' : '')
      + '<span>' + cms + ' הגיבו</span>' + (joined ? '<span>' + joined + ' הצטרפו</span>' : '')
    : '<span>עוד לא פורסם כאן</span>';
  var body = '';
  if(open){
    var sug = fbSuggest(g.id), pick = FBPICK[g.id] || sug, used = {};
    ps.forEach(function(p){ used[p.variant] = 1; });
    var picks = FB.variants.map(function(v){
      return '<button class="' + (v.id === pick ? 'on' : '') + (used[v.id] ? ' used' : '') + '" data-act="pick" data-g="' + g.id + '" data-v="' + v.id + '">'
        + esc(v.id) + ' · ' + esc(v.title) + '</button>'; }).join('');
    var go = g.url
      ? '<a class="fbtn go" href="' + esc(g.url) + '" target="_blank" rel="noopener" data-act="copy-go" data-g="' + g.id + '">העתק נוסח ופתח את הקבוצה</a>'
      : '<button class="fbtn go" data-act="copy-go" data-g="' + g.id + '">העתק נוסח</button>';
    var ask = FBASK[g.id]
      ? '<div class="ask"><p>פרסמת בקבוצה?</p><div class="fbrow" style="margin-top:0">'
        + '<button class="fbtn ok" data-act="posted" data-g="' + g.id + '" data-s="pending">כן, ממתין לאישור</button>'
        + '<button class="fbtn" data-act="posted" data-g="' + g.id + '" data-s="live">כן, עלה ישר</button>'
        + '<button class="fbtn" data-act="not-posted" data-g="' + g.id + '">לא</button></div></div>'
      : '';
    body = '<div class="fgb">'
      + '<h4>קישור לקבוצה</h4>'
      + '<div class="urlrow"><input placeholder="https://www.facebook.com/groups/..." value="' + esc(g.url) + '" data-in="url" data-g="' + g.id + '">'
      +   '<button class="fbtn sm" data-act="url" data-g="' + g.id + '">שמירה</button></div>'
      + '<h4>' + (ps.length ? 'פרסום חוזר' : 'פרסום') + '</h4>'
      + '<div class="vpick">' + picks + '</div>'
      + '<div class="vsug">מוצע: נוסח ' + esc(sug) + (used[sug] ? '' : ', עוד לא נשלח לקבוצה הזו') + '</div>'
      + '<div class="vprev">' + esc(fbVar(pick).text) + '</div>'
      + '<div class="fbrow">' + go + '</div>' + ask
      + (ps.length ? '<h4>היסטוריה ומגיבים</h4>' + ps.map(fbPostHtml).join('') : '')
      + '</div>';
  }
  return '<div class="fg st-' + st + '">'
    + '<div class="fgh" data-act="open" data-g="' + g.id + '"><span class="fgn">' + esc(g.name) + '</span>'
    + '<span class="fgs st-' + st + '">' + (lp ? PST[st] : 'טרם פורסם') + '</span></div>'
    + '<div class="fgm">' + meta + '</div>' + body + '</div>';
}

function fbVariantsHtml(){
  var perf = {};
  FB.posts.forEach(function(p){
    var r = perf[p.variant] || (perf[p.variant] = { n:0, live:0, cms:0, joined:0 });
    r.n++; if(p.status === 'live') r.live++;
    (p.commenters || []).forEach(function(c){ r.cms++; if(c.joined) r.joined++; });
  });
  var rows = FB.variants.map(function(v){
    var r = perf[v.id] || { n:0, live:0, cms:0, joined:0 };
    return '<tr><td>' + esc(v.id) + ' · ' + esc(v.title) + '</td><td>' + r.n + '</td><td>' + r.live
      + '</td><td>' + r.cms + '</td><td>' + r.joined + '</td></tr>'; }).join('');
  var edits = FB.variants.map(function(v){
    return '<div class="vcard vedit"><b>נוסח ' + esc(v.id) + ' · ' + esc(v.title) + '</b>'
      + '<textarea data-in="vtext" data-v="' + v.id + '">' + esc(v.text) + '</textarea>'
      + '<div class="fbrow"><button class="fbtn sm" data-act="v-save" data-v="' + v.id + '">שמירת הנוסח</button>'
      + '<button class="fbtn sm" data-act="v-copy" data-v="' + v.id + '">העתקה</button></div></div>'; }).join('');
  return '<details class="fbsec"><summary>איזה נוסח עובד הכי טוב</summary>'
    + '<div class="tw"><table class="adtab"><thead><tr><th>נוסח</th><th>פרסומים</th><th>באוויר</th>'
    + '<th>הגיבו</th><th>הצטרפו</th></tr></thead><tbody>' + rows + '</tbody></table></div></details>'
    + '<details class="fbsec"><summary>עריכת הנוסחים</summary>' + edits
    + '<div class="vcard vedit"><b>ההודעה בפרטי למי שהגיב</b>'
    + '<textarea data-in="dm" style="min-height:110px">' + esc(FB.dm || '') + '</textarea>'
    + '<div class="fbrow"><button class="fbtn sm" data-act="dm-save">שמירה</button></div></div></details>';
}

function fbRender(){
  if(!FB) { document.getElementById('fb').innerHTML = '<p class="empty">טוען...</p>'; return; }
  if(TAB === 'fb') fbStats();
  var h = '<div class="fbrow" style="margin:0 0 18px"><button class="fbtn go" data-act="dm-copy">'
    + 'העתק את הודעת הקישור לפרטי</button></div>';
  CATS.forEach(function(c){
    var gs = FB.groups.filter(function(g){ return (g.cat || 'other') === c[0]; });
    if(!gs.length) return;
    var done = gs.filter(function(g){ return fbPosts(g.id).length; }).length;
    h += '<section class="fbcat"><h2>' + esc(c[1]) + ' <span class="n">' + done + '/' + gs.length + '</span></h2>'
      + gs.map(fbGroupHtml).join('') + '</section>';
  });
  var catOpts = CATS.map(function(c){ return '<option value="' + c[0] + '">' + esc(c[1]) + '</option>'; }).join('');
  h += fbVariantsHtml()
    + '<details class="fbsec"><summary>הוספת קבוצה</summary><div class="gadd">'
    + '<select data-in="g-cat">' + catOpts + '</select>'
    + '<input placeholder="שם הקבוצה" data-in="g-name">'
    + '<input placeholder="קישור לקבוצה (לא חובה)" data-in="g-url" style="direction:ltr;text-align:left">'
    + '<button class="fbtn go" data-act="g-add">הוספת הקבוצה</button></div></details>';
  document.getElementById('fb').innerHTML = h;
}

function fbVal(sel){ var e = document.querySelector('#fb ' + sel); return e ? e.value : ''; }

document.getElementById('fb').addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-act]');
  if(!b) return;
  var act = b.getAttribute('data-act'), g = b.getAttribute('data-g'),
      p = b.getAttribute('data-p'), c = b.getAttribute('data-c'), v = b.getAttribute('data-v');
  var post = p && FB.posts.filter(function(x){ return x.id === p; })[0];
  var cm = post && c && (post.commenters || []).filter(function(x){ return x.id === c; })[0];

  if(act === 'open'){ FBOPEN[g] = !FBOPEN[g]; FBASK[g] = false; fbRender(); return; }
  if(act === 'pick'){ FBPICK[g] = v; fbRender(); return; }
  if(act === 'copy-go'){
    /* ההעתקה חייבת לקרות בתוך הלחיצה עצמה, אחרת הנייד חוסם אותה. הקישור
       נפתח מעצמו כי זה עוגן אמיתי, והרינדור נדחה כדי לא לעקור אותו. */
    var vid = FBPICK[g] || fbSuggest(g);
    toast(fbCopy(fbVar(vid).text) ? 'הנוסח הועתק, הדבק בקבוצה' : 'לא הצלחתי להעתיק');
    FBASK[g] = true; FBPICK[g] = vid;
    setTimeout(fbRender, 400);
    return;
  }
  if(act === 'posted'){
    FBASK[g] = false;
    fbDo({ op:'post_add', group:g, variant: FBPICK[g] || fbSuggest(g), status: b.getAttribute('data-s') }, 'נרשם');
    FBPICK[g] = null; return;
  }
  if(act === 'not-posted'){ FBASK[g] = false; fbRender(); return; }
  if(act === 'url'){ fbDo({ op:'group_set', group:g, url: fbVal('[data-in="url"][data-g="' + g + '"]') }, 'הקישור נשמר'); return; }
  if(act === 'p-del'){ if(confirm('למחוק את הפרסום הזה?')) fbDo({ op:'post_del', post:p }, 'נמחק'); return; }
  if(act === 'c-add'){
    fbDo({ op:'c_add', post:p, name: fbVal('[data-in="c-name"][data-p="' + p + '"]') }, 'המגיב נוסף'); return;
  }
  if(act === 'c-sent' && cm){
    if(!cm.sent) fbCopy(FB.dm || '');
    fbDo({ op:'c_set', post:p, c:c, sent: !cm.sent }, cm.sent ? '' : 'הודעת הקישור הועתקה, שלח לו בפרטי'); return;
  }
  if(act === 'c-joined' && cm){ fbDo({ op:'c_set', post:p, c:c, joined: !cm.joined }); return; }
  if(act === 'c-del'){ if(confirm('למחוק את המגיב?')) fbDo({ op:'c_del', post:p, c:c }); return; }
  if(act === 'dm-copy'){ toast(fbCopy(FB.dm || '') ? 'הודעת הקישור הועתקה' : 'לא הצלחתי להעתיק'); return; }
  if(act === 'v-copy'){ toast(fbCopy(fbVar(v).text) ? 'הנוסח הועתק' : 'לא הצלחתי להעתיק'); return; }
  if(act === 'v-save'){ fbDo({ op:'variant_set', variant:v, text: fbVal('[data-in="vtext"][data-v="' + v + '"]') }, 'הנוסח נשמר'); return; }
  if(act === 'dm-save'){ fbDo({ op:'dm_set', text: fbVal('[data-in="dm"]') }, 'נשמר'); return; }
  if(act === 'g-add'){
    var name = fbVal('[data-in="g-name"]').trim();
    if(!name){ toast('חסר שם לקבוצה'); return; }
    fbDo({ op:'group_add', cat: fbVal('[data-in="g-cat"]'), name: name, url: fbVal('[data-in="g-url"]') }, 'הקבוצה נוספה');
    return;
  }
});
document.getElementById('fb').addEventListener('change', function(e){
  var s = e.target;
  if(s.getAttribute('data-act') === 'p-status')
    fbDo({ op:'post_status', post: s.getAttribute('data-p'), status: s.value }, 'הסטטוס עודכן');
});
document.getElementById('fb').addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  var i = e.target;
  if(i.getAttribute('data-in') === 'c-name'){
    e.preventDefault();
    var p = i.getAttribute('data-p');
    fbDo({ op:'c_add', post:p, name: i.value }, 'המגיב נוסף');
  }
});

/* סנכרון בין המכשירים: בחזרה ללשונית, וכל חצי דקה כשהיא פתוחה. לא
   מרעננים באמצע הקלדה, אחרת מה שכתבת נמחק מתחת לאצבעות. */
function fbTyping(){
  var a = document.activeElement;
  return a && document.getElementById('fb').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && TAB === 'fb' && KEY && !fbTyping()) fbLoad(false, true);
});
setInterval(function(){
  if(TAB === 'fb' && KEY && !document.hidden && !fbTyping()) fbLoad(false, true);
}, 30000);

/* ══════════════════════════════════════════════════════════
   לשונית ניהול לקוחות · מושכת מוורקר הפרויקטים (dg-gal-projects)
   ══════════════════════════════════════════════════════════ */
function pjLink(p, token){
  return PWORKER + '/p/' + encodeURIComponent(p.id) + '?t=' + encodeURIComponent(token || '');
}
function pjCard(p){
  var total = p.total || 0, done = p.done || 0, pct = total ? Math.round(done / total * 100) : 0;
  var mineDone = p.mine_done || 0, mineTot = p.mine_total || 0;
  var clDone = p.client_done || 0, clTot = p.client_total || 0, clOpen = Math.max(0, clTot - clDone);
  var mineCls = (mineTot > 0 && mineDone === mineTot) ? ' doneall' : '';
  var clCls = clTot === 0 ? '' : (clOpen > 0 ? ' wait' : ' doneall');
  var clV = clTot === 0 ? '—' : (clOpen > 0 ? String(clOpen) : 'הכל התקבל');
  var owner = pjLink(p, p.owner_token), client = pjLink(p, p.client_token);
  var last = p.last_activity ? ago(p.last_activity) : '';
  var h = '<div class="pj">';
  h += '<h3>' + esc(p.business || p.id) + '</h3>';
  if(p.client_name) h += '<div class="who">' + esc(p.client_name) + '</div>';
  h += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  h += '<div class="pln"><span><span class="fr"><b>' + done + '</b> / ' + total + '</span> פעולות</span><b>' + pct + '%</b></div>';
  h += '<div class="rows">';
  h += '<div class="mini' + mineCls + '"><div class="k">הצד שלי</div><div class="v"><span class="fr">' + mineDone + ' / ' + mineTot + '</span></div></div>';
  h += '<div class="mini' + clCls + '"><div class="k">ממתין מהלקוח</div><div class="v">' + clV + '</div></div>';
  h += '</div>';
  if(last) h += '<div class="last">פעילות אחרונה: ' + esc(last) + '</div>';
  h += '<div class="acts">';
  h += '<a class="open" href="' + esc(owner) + '" target="_blank" rel="noopener">פתח דוח</a>';
  h += '<button class="cp" type="button" data-copy="' + esc(client) + '">העתק קישור ללקוח</button>';
  h += '<a class="cp" href="' + esc(client) + '" target="_blank" rel="noopener">כלקוח ↗</a>';
  h += '</div></div>';
  return h;
}
function pjNewFormHtml(){
  return '<details class="pjnew" id="pjNewForm">'
    + '<summary>פרויקט חדש</summary>'
    + '<div class="nf">'
    + '<input id="pj-biz" placeholder="שם העסק" autocomplete="off">'
    + '<input id="pj-client" placeholder="שם הלקוח" autocomplete="off">'
    + '<input id="pj-id" class="idf" placeholder="מזהה באנגלית (למשל anderdog)" autocomplete="off">'
    + '<div class="hint">המזהה יופיע בקישור. אותיות אנגלית, מספרים, מקף בלבד.</div>'
    + '<button type="button" class="go" id="pj-create">צור פרויקט</button>'
    + '</div></details>';
}
function clientsStats(){
  var totalP = PROJECTS.length;
  var waiting = PROJECTS.reduce(function(s, p){ return s + Math.max(0, (p.client_total || 0) - (p.client_done || 0)); }, 0);
  var doneP = PROJECTS.filter(function(p){ return (p.total || 0) > 0 && p.done === p.total; }).length;
  document.getElementById('stats').innerHTML =
      '<span>פרויקטים <b>' + totalP + '</b></span>'
    + '<span>ממתין מלקוחות <b>' + waiting + '</b></span>'
    + '<span>הושלמו <b>' + doneP + '</b></span>';
}
function clientsRender(){
  clientsStats();
  var host = document.getElementById('clients');
  if(!document.getElementById('pjNewForm')){
    host.innerHTML = pjNewFormHtml() + '<div id="pjGridWrap"></div>';
  }
  var wrap = document.getElementById('pjGridWrap');
  if(!PROJECTS.length){
    wrap.innerHTML = '<div class="pjempty">אין עדיין פרויקטים.<br>צרו פרויקט חדש למעלה, או שאוסיף פרויקט מתוך סשן העבודה.</div>';
  } else {
    wrap.innerHTML = '<div class="pjgrid">' + PROJECTS.map(pjCard).join('') + '</div>';
  }
}
async function clientsLoad(withBtn, silent){
  if(!PKEY){
    document.getElementById('clients').innerHTML =
      '<div class="pjempty">כדי לטעון את הפרויקטים צאו והיכנסו מחדש (טעינת ההרשאה החדשה).</div>';
    return;
  }
  var b = document.getElementById('rbtn');
  if(withBtn){ b.disabled = true; b.textContent = 'טוען...'; }
  try {
    var r = await pwk('/api/admin/projects');
    PROJECTS = r.projects || [];
    clientsRender();
  } catch(x){ if(!silent) toast(x.message === 'unauthorized' ? 'אין הרשאה לפרויקטים' : x.message); }
  if(withBtn){ b.disabled = false; b.textContent = 'רענון'; }
}
async function createProject(){
  var biz = ((document.getElementById('pj-biz') || {}).value || '').trim();
  var cl  = ((document.getElementById('pj-client') || {}).value || '').trim();
  var id  = ((document.getElementById('pj-id') || {}).value || '').trim();
  if(!biz){ toast('צריך שם עסק'); return; }
  if(!/^[A-Za-z0-9_-]+$/.test(id)){ toast('מזהה באנגלית בלבד (אותיות, מספרים, מקף)'); return; }
  if(PROJECTS.some(function(p){ return p.id === id; })){ toast('כבר קיים פרויקט עם המזהה הזה'); return; }
  var btn = document.getElementById('pj-create'); btn.disabled = true; btn.textContent = 'יוצר...';
  try {
    await pwk('/api/p/' + encodeURIComponent(id) + '/admin',
      { method:'POST', body: JSON.stringify({ op:'create_project', business: biz, client_name: cl }) });
    await clientsLoad(false, true);
    ['pj-biz','pj-client','pj-id'].forEach(function(i){ var el = document.getElementById(i); if(el) el.value = ''; });
    var f = document.getElementById('pjNewForm'); if(f) f.open = false;
    toast('הפרויקט נוצר');
  } catch(x){ toast(x.message === 'unauthorized' ? 'אין הרשאה' : ('לא נוצר: ' + x.message)); }
  btn.disabled = false; btn.textContent = 'צור פרויקט';
}
document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'pj-create'){ e.preventDefault(); createProject(); }
});
function clientsTyping(){
  var a = document.activeElement;
  return a && document.getElementById('clients').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && TAB === 'clients' && PKEY && !clientsTyping()) clientsLoad(false, true);
});
setInterval(function(){
  if(TAB === 'clients' && PKEY && !document.hidden && !clientsTyping()) clientsLoad(false, true);
}, 30000);

  var k = null, pk = null;
  try { k = sessionStorage.getItem('dg_k'); pk = sessionStorage.getItem('dg_pk'); } catch(x){}
  if(!k) return;
  KEY = k; PKEY = pk;
  wk('/leads').then(function(r){
    LEADS = r.leads || [];
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
    restoreTab();
  }).catch(function(){
    KEY = null;
    try { sessionStorage.removeItem('dg_k'); } catch(x){}
  });
})();
